<title>dakit — app shell</title>
<script>
  const params = new URLSearchParams(location.search);
  const urlTheme = params.get("theme");
  let stored = null;
  try { stored = localStorage.getItem("dakit-theme"); } catch {}
  const theme = urlTheme === "dark" || urlTheme === "light" ? urlTheme : stored;
  document.documentElement.dataset.theme =
    theme === "dark" || theme === "light" ? theme : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>

  .demo-row:first-child { border-top: 0; }
  .demo-row > span:empty { display: none; }
  .demo-row > :last-child { grid-column: -2; }
  .demo-row:hover { background: var(--dk-bg-hover); }
  .demo-row__title { color: var(--dk-text-primary); font-size: var(--dk-text-body); font-weight: var(--dk-weight-medium); }
  .demo-row__meta { color: var(--dk-text-muted); font-size: var(--dk-text-sm); }
  .demo-row__when { color: var(--dk-text-muted); font-family: var(--dk-font-mono); font-size: var(--dk-text-sm); white-space: nowrap; }

  // No data-app on the demo shell, so collapse state is not persisted here.
  (() => {

<script src="dist/collection.js"></script>
<script>
  (() => {
    const shell = dakitShell;
    const bell = document.getElementById("bell-count");
    const unread = () => document.querySelectorAll('.dk-notif-item[data-unread="true"]');
    const refresh = () => {
      const n = unread().length;
      if (bell) shell.setCount(bell, n);
      const all = document.getElementById("mark-all");
      if (all) all.hidden = n === 0;
    };
    const showEmpty = () => {
      document.getElementById("notif-body").innerHTML =
        '<div class="dk-empty dk-empty--compact"><p class="dk-empty__title">No unread notifications</p><p class="dk-empty__desc">New assignments, replies and failures on things you own show up here.</p></div>';
      refresh();
    };
    document.addEventListener("click", (event) => {
      const read = event.target.closest(".dk-notif-item__read");
      if (read) { read.closest(".dk-notif-item").removeAttribute("data-unread"); read.closest(".dk-notif-item").querySelector(".dk-notif-item__marker").replaceChildren(); refresh(); }
      if (event.target.closest("#mark-all")) { unread().forEach((row) => { row.removeAttribute("data-unread"); row.querySelector(".dk-notif-item__marker").replaceChildren(); }); refresh(); document.getElementById("dk-notif-title").focus(); }
      if (event.target.closest('a[href="#"]')) event.preventDefault();
    });
    refresh();
    const state = params.get("state") || "";
    const s = document.querySelector(".dk-shell");
    if (state.startsWith("rail")) shell.setSidebar(s, "collapsed");
    if (state === "notif-empty") showEmpty();
    if (state === "account") shell.openPopover("dk-account-menu");
    if (state.includes("notif")) shell.openPopover("dk-notif-panel");
    if (state === "drawer") shell.toggleDrawer(s, true);
  })();
</script>
